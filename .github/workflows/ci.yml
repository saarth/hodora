name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build doesn't depend on a real Supabase
          # project — nothing at build time actually calls the client (see
          # src/integrations/supabase/client.ts's lazy Proxy), this just
          # keeps that path from ever hitting its "missing env var" guard.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key
