# Self-hosting (Unraid, any Docker host). See README.md's
# "Self-hosting with Docker" section for the env vars this needs.
#
#   docker compose up -d --build
#
# `docker compose` auto-loads a `.env` file from this same directory for the
# ${VAR} substitutions below — the project's existing `.env` (see
# .env.example) already has everything except SUPABASE_SERVICE_ROLE_KEY.
services:
  hodora:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      # Bypasses RLS — runtime env var only, never a build arg (build args
      # can end up visible in image layer history).
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Optional — only needed for the "Connections" cloud-sync feature.
      # Same never-a-build-arg rule applies. See .env.example.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    restart: unless-stopped

  # Optional: runs the Cloudflare Tunnel alongside Hodora instead of as a
  # separate native process. Create the tunnel in the Cloudflare Zero Trust
  # dashboard (Networks -> Tunnels -> Create a tunnel -> Cloudflared) and set
  # its public hostname there too (Public Hostname tab -> point it at
  # http://hodora:3000, the compose service name). Copy the token the
  # dashboard gives you into CLOUDFLARE_TUNNEL_TOKEN in .env. Comment this
  # whole service out if you're running cloudflared some other way (native
  # install, a separate Unraid container, etc.).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - hodora
    restart: unless-stopped
