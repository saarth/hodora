[versions]
# These were current as of when this scaffold was written. Android Studio
# will flag newer stable releases on sync (or via Tools > Kotlin > Configure
# Kotlin plugin updates / the version catalog quick-fixes) — since this
# project can't be built in the environment that generated it (no Android
# SDK, no Maven Central access), treat a Gradle sync failure here as "bump
# this version", not as a sign the dependency doesn't exist.
agp = "8.13.0"
# Bumped from 2.1.20: play-services-location 21.4.0 bundles Kotlin modules
# compiled with Kotlin 2.3's metadata format (confirmed by a real Gradle
# build's compileDebugKotlin error — "Module was compiled with an
# incompatible version of Kotlin. The binary version of its metadata is
# 2.3.0, expected version is 2.1.0"), which a 2.1.x compiler can't read.
# The Compose compiler plugin below tracks this same version, so bumping
# it here updates both together.
kotlin = "2.3.20"
coreKtx = "1.15.0"
lifecycle = "2.9.0"
activityCompose = "1.10.1"
navigationCompose = "2.9.0"
composeBom = "2025.06.01"
supabase = "3.1.4"
ktor = "3.1.1"
kotlinxSerialization = "1.8.0"
# MapLibre Native for Android: https://github.com/maplibre/maplibre-native
maplibre = "13.4.1"
playServicesLocation = "21.4.0"
# Room for the Phase 5 offline ride cache (data/local/). Uses kapt for the
# annotation processor rather than KSP — kapt's version tracks the project's
# own Kotlin version automatically (no separate version to guess right
# without Maven access), where KSP needs an exact
# "<kotlin-version>-<ksp-version>" pin that can't be verified from here.
# Bumped from 2.7.1: room-compiler's bundled kotlin-metadata-jvm library only
# read metadata up to version 2.2.0 (confirmed by a real Gradle build's
# kaptDebugKotlin error — "Provided Metadata instance has version 2.3.0,
# while maximum supported version is 2.2.0. To support newer versions,
# update the kotlin-metadata-jvm library."), the same class of mismatch
# play-services-location hit above, just on Room's annotation processor
# instead of a runtime dependency. If this specific version still bundles a
# kotlin-metadata-jvm too old for whatever Kotlin version is pinned above,
# bump it further.
room = "2.8.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# supabase-kt: https://github.com/supabase-community/supabase-kt — module
# artifact names/package paths (io.github.jan.supabase.*) have shifted
# across major versions before; double check against the version actually
# resolved if auth-kt/postgrest-kt fail to resolve.
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
